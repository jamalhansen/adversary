[project]
name = "adversary"
version = "0.1.0"
description = "Argues against your change or plan: the strongest objection, falsifiable challenges, and what should have been built instead"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "click<8.3.2",  # 8.3.2 breaks typer 0.24.1's option parsing: AttributeError 'bool' object has no attribute 'isidentifier'. Unpin once a compatible typer release lands.
    "rich>=14.3.3",
    "local-first-common",
]

[project.scripts]
adversary = "adversary.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adversary"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
